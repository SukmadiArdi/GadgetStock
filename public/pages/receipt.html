<!-- pages/receipt.html - Success/Receipt Screen -->
<div class="fade-in" style="max-width:36rem;margin:0 auto;padding:1rem;">

  <!-- Success Icon -->
  <div style="text-align:center;margin-bottom:2rem;">
    <div style="width:5rem;height:5rem;border-radius:50%;background:linear-gradient(135deg,#22c55e,#16a34a);display:flex;align-items:center;justify-content:center;margin:0 auto 1rem;box-shadow:0 8px 24px rgba(34,197,94,0.35);animation:scaleIn 0.4s cubic-bezier(0.34,1.56,0.64,1);">
      <span class="material-symbols-outlined icon-filled" style="font-size:2.5rem;color:#fff;">check_circle</span>
    </div>
    <h1 style="font-size:1.5rem;font-weight:800;color:#1e3a5f;">Payment Successful!</h1>
    <p style="font-size:0.875rem;color:var(--on-surface-variant);margin-top:0.25rem;" id="receipt-txn-num">—</p>
  </div>

  <!-- Receipt Card -->
  <div class="card" style="overflow:hidden;margin-bottom:1.5rem;" id="receipt-card">
    <!-- Store Header -->
    <div style="background:var(--primary-container);padding:1.5rem;text-align:center;">
      <h2 style="font-size:1.125rem;font-weight:800;color:#fff;" id="receipt-store-name">GadgetStock</h2>
      <p style="font-size:0.75rem;color:var(--on-primary-container);" id="receipt-terminal">Terminal 01</p>
      <p style="font-size:0.75rem;color:var(--on-primary-container);margin-top:0.25rem;" id="receipt-datetime"></p>
    </div>

    <!-- Items -->
    <div style="padding:1rem;" id="receipt-items"></div>

    <!-- Divider -->
    <div style="padding:0 1rem;"><div style="border-top:2px dashed var(--outline-variant);"></div></div>

    <!-- Totals -->
    <div style="padding:1rem;" id="receipt-totals"></div>

    <!-- Payment Info -->
    <div style="background:var(--surface-container-low);padding:1rem 1.25rem;display:flex;justify-content:space-between;align-items:center;">
      <div>
        <p style="font-size:0.625rem;text-transform:uppercase;letter-spacing:0.1em;font-weight:700;color:var(--on-surface-variant);">Payment Method</p>
        <p style="font-size:0.875rem;font-weight:700;color:#1e3a5f;text-transform:capitalize;" id="receipt-method">—</p>
      </div>
      <div id="change-section" style="text-align:right;display:none;">
        <p style="font-size:0.625rem;text-transform:uppercase;letter-spacing:0.1em;font-weight:700;color:var(--on-surface-variant);">Change</p>
        <p style="font-size:0.875rem;font-weight:700;color:#1e3a5f;" id="receipt-change" class="text-rupiah">—</p>
      </div>
    </div>
    <!-- Receipt Footer -->
    <div style="padding:1rem 1.5rem;text-align:center;border-top:1px dashed var(--outline-variant);">
      <p style="font-size:0.75rem;color:var(--on-surface-variant);font-style:italic;" id="receipt-footer-text">Terima kasih telah berbelanja!</p>
    </div>
  </div>

  <!-- Actions -->
  <div style="display:flex;flex-direction:column;gap:0.75rem;">
    <button class="btn btn-primary btn-full" onclick="window.print()">
      <span class="material-symbols-outlined">print</span>Print Receipt
    </button>
    <button class="btn btn-secondary btn-full" onclick="navigate('/pos'); State?.clearCart?.()">
      <span class="material-symbols-outlined">add_circle</span>New Transaction
    </button>
    <button class="btn btn-ghost btn-full" onclick="navigate('/dashboard')">
      <span class="material-symbols-outlined">dashboard</span>Back to Dashboard
    </button>
  </div>
</div>

<style>
@media print {
  #sidebar,#topbar,#bottom-nav,.btn { display:none!important; }
  #page-content { margin:0;padding:0; }
  .card { box-shadow:none;border:1px solid #ccc; }
}
</style>

<script type="module">
import State from '/js/state.js';
import { formatRupiah, formatDate } from '/js/utils.js';

function init() {
  const txn = State.currentTxn;
  if (!txn) { navigate('/dashboard'); return; }

  document.getElementById('receipt-txn-num').textContent = `Transaction #${txn.txn_number}`;
  document.getElementById('receipt-terminal').textContent = txn.terminal || 'Terminal 01';
  document.getElementById('receipt-datetime').textContent = formatDate(txn.created_at, 'datetime');
  document.getElementById('receipt-method').textContent = txn.payment_method || '—';

  if (txn.payment_method === 'cash' && txn.change_amount > 0) {
    document.getElementById('change-section').style.display = 'block';
    document.getElementById('receipt-change').textContent = formatRupiah(txn.change_amount);
  }

  const items = txn.transaction_items || [];
  document.getElementById('receipt-items').innerHTML = items.map(item => `
    <div style="display:flex;justify-content:space-between;padding:0.5rem 0.25rem;font-size:0.875rem;">
      <div>
        <p style="font-weight:600;">${item.product_name}</p>
        <p style="font-size:0.75rem;color:var(--on-surface-variant);">x${item.quantity} × ${formatRupiah(item.unit_price)}</p>
      </div>
      <span style="font-weight:700;" class="text-rupiah">${formatRupiah(item.subtotal)}</span>
    </div>
  `).join('');

  // Calculate the actual tax % from the transaction data
  const taxRatePct = txn.subtotal > 0
    ? ((txn.tax_amount / txn.subtotal) * 100).toFixed(1).replace(/\.0$/, '')
    : (State.settings.taxRate * 100).toFixed(1).replace(/\.0$/, '');

  // Store name and footer from settings
  const storeName = State.settings.storeName || 'GadgetStock';
  const footer = State.settings.receiptFooter || 'Terima kasih telah berbelanja!';
  document.getElementById('receipt-store-name').textContent = storeName;
  document.getElementById('receipt-footer-text').textContent = footer;

  document.getElementById('receipt-totals').innerHTML = `
    <div style="display:flex;flex-direction:column;gap:0.5rem;">
      <div style="display:flex;justify-content:space-between;font-size:0.8125rem;color:var(--on-surface-variant);">
        <span>Subtotal</span><span class="text-rupiah">${formatRupiah(txn.subtotal)}</span>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:0.8125rem;color:var(--on-surface-variant);">
        <span>Tax (${taxRatePct}%)</span><span class="text-rupiah">${formatRupiah(txn.tax_amount)}</span>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:1rem;font-weight:800;color:#1e3a5f;padding-top:0.5rem;border-top:1px solid var(--outline-variant);">
        <span>TOTAL</span><span class="text-rupiah">${formatRupiah(txn.total)}</span>
      </div>
    </div>
  `;
}

window.State = State;

// Re-render receipt when settings arrive from server (store name / footer may update)
State.on('settings', init);

init();
</script>
