<!-- pages/checkout.html - Checkout Screen -->
<div class="fade-in" style="max-width:64rem;margin:0 auto;height:100%;display:flex;flex-direction:column;">

  <!-- Header -->
  <div style="display:flex;align-items:center;gap:1rem;margin-bottom:1.5rem;flex-shrink:0;">
    <button class="btn btn-ghost btn-sm" onclick="navigate('/pos')" style="background:var(--surface-container-high);">
      <span class="material-symbols-outlined">arrow_back</span>
    </button>
    <div>
      <h1 style="font-size:1.5rem;font-weight:800;color:#1e3a5f;">Checkout</h1>
      <p style="font-size:0.75rem;color:var(--on-surface-variant);">Complete the transaction</p>
    </div>
  </div>

  <div id="checkout-grid" style="display:grid;grid-template-columns:1fr 1.2fr;gap:2rem;flex:1;overflow:hidden;min-height:0;">

    <!-- Left: Order Summary -->
    <div style="display:flex;flex-direction:column;overflow:hidden;">
      <h2 style="font-size:0.8125rem;font-weight:700;color:var(--on-surface-variant);text-transform:uppercase;letter-spacing:0.1em;margin-bottom:1rem;">Order Summary</h2>
      
      <!-- Scrollable Item List -->
      <div class="card" style="flex:1;overflow-y:auto;margin-bottom:1rem;background:var(--surface-container-low);" id="order-summary" class="custom-scroll"></div>

      <!-- Totals -->
      <div class="card" style="padding:1.5rem;background:var(--primary-container);color:#fff;box-shadow:var(--shadow-lg);flex-shrink:0;">
        <div style="display:flex;flex-direction:column;gap:0.75rem;">
          <div style="display:flex;justify-content:space-between;font-size:0.875rem;opacity:0.8;">
            <span>Subtotal</span><span id="co-subtotal" class="text-rupiah">—</span>
          </div>
          <div style="display:flex;justify-content:space-between;font-size:0.875rem;opacity:0.8;">
            <span id="co-tax-label">Tax</span><span id="co-tax" class="text-rupiah">—</span>
          </div>
          <div style="border-top:1px solid rgba(255,255,255,0.1);padding-top:1rem;display:flex;justify-content:space-between;align-items:center;">
            <span style="font-size:1rem;font-weight:700;">Grand Total</span>
            <span id="co-total" style="font-size:1.75rem;font-weight:800;letter-spacing:-0.03em;" class="text-rupiah">—</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Right: Payment -->
    <div>
      <h2 style="font-size:0.875rem;font-weight:700;color:var(--on-surface-variant);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:1rem;">Payment Method</h2>

      <!-- Payment Options (Desktop: Grid, Mobile: Select) -->
      <div class="desktop-only" style="display:grid;grid-template-columns:1fr 1fr;gap:0.75rem;margin-bottom:1.5rem;" id="payment-options-container">
      </div>
      
      <div class="mobile-only" style="margin-bottom:1.5rem;">
        <select id="payment-method-select" class="form-input" style="height:3.5rem;font-weight:600;background-image:url('data:image/svg+xml;charset=utf-8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'24\' height=\'24\' viewBox=\'0 0 24 24\' fill=\'none\' stroke=\'%2343474e\' stroke-width=\'2\' stroke-linecap=\'round\' stroke-linejoin=\'round\'><polyline points=\'6 9 12 15 18 9\'></polyline></svg>');background-repeat:no-repeat;background-position:right 1rem center;background-size:1.5em;appearance:none;" onchange="selectMethod({dataset:{method:this.value}})">
        </select>
      </div>

      <!-- Payment Form Container (prevents Layout Shifts by keeping height stable) -->
      <div style="height: 19rem; margin-bottom: 1.5rem; position: relative;">
        
        <!-- Cash Form -->
        <div id="cash-form" class="card" style="padding:1.5rem; height:100%; box-sizing:border-box; display:flex; flex-direction:column; justify-content:space-between;">
          <div class="form-group">
            <label class="form-label">Cash Received</label>
            <div style="position:relative;">
              <span style="position:absolute;left:1rem;top:50%;transform:translateY(-50%);font-weight:700;color:var(--on-surface-variant);">Rp</span>
              <input type="text" id="cash-input" class="form-input" placeholder="0" style="padding-left:3rem;font-size:1.25rem;font-weight:700;height:3.25rem;" oninput="formatCurrencyInput(this); calcChange()" />
            </div>
          </div>
          
          <!-- Quick Cash Buttons -->
          <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:0.5rem;">
            <button class="btn btn-ghost btn-sm" onclick="setCash('exact')" style="font-size:0.625rem;padding:0.5rem 0;">Pas</button>
            <button class="btn btn-ghost btn-sm" onclick="setCash(50000)" style="font-size:0.625rem;padding:0.5rem 0;">50k</button>
            <button class="btn btn-ghost btn-sm" onclick="setCash(100000)" style="font-size:0.625rem;padding:0.5rem 0;">100k</button>
            <button class="btn btn-ghost btn-sm" onclick="setCash(200000)" style="font-size:0.625rem;padding:0.5rem 0;">200k</button>
          </div>

          <div style="background:var(--surface-container-lowest);border-radius:0.75rem;padding:0.875rem 1rem;display:flex;justify-content:space-between;align-items:center;border:1px solid var(--outline-variant);height:4.25rem;box-sizing:border-box;">
            <div>
              <p style="font-size:0.625rem;text-transform:uppercase;letter-spacing:0.1em;font-weight:700;color:var(--on-surface-variant);margin-bottom:0.125rem;">Change</p>
              <span id="change-amount" style="font-size:1.375rem;font-weight:800;color:var(--primary-container);" class="text-rupiah">Rp 0</span>
            </div>
            <div style="background:var(--primary-container);color:#fff;width:2.25rem;height:2.25rem;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
              <span class="material-symbols-outlined" style="font-size:1.25rem;">payments</span>
            </div>
          </div>
        </div>

        <!-- Non-cash notice & mockup (Structured IDENTICALLY to Cash Form) -->
        <div id="noncash-form" class="card" style="padding:1.5rem; height:100%; box-sizing:border-box; display:none; flex-direction:column; justify-content:space-between;">
          
          <!-- Row 1: Amount to Pay (Identical height & padding to Cash's Cash Received) -->
          <div class="form-group">
            <label class="form-label" id="noncash-amount-label">Amount to Pay</label>
            <div style="position:relative;">
              <span style="position:absolute;left:1rem;top:50%;transform:translateY(-50%);font-weight:700;color:var(--on-surface-variant);">Rp</span>
              <input type="text" id="noncash-amount-display" class="form-input" disabled style="padding-left:3rem;font-size:1.25rem;font-weight:700;height:3.25rem;background:var(--surface-container-low);color:var(--primary-container);" value="—" />
            </div>
          </div>
          
          <!-- Row 2: Status Indicator Pill (Identical height to Cash's Quick Buttons) -->
          <div style="height:2rem; display:flex; align-items:center; background:rgba(79,70,229,0.08); border-radius:0.5rem; padding:0 0.75rem; border:1px dashed rgba(79,70,229,0.3); gap:0.5rem; box-sizing:border-box;">
            <span class="material-symbols-outlined" style="font-size:1.125rem; color:#4f46e5; animation: pulse 1.5s infinite;" id="noncash-status-icon">sensors</span>
            <span id="noncash-status-text" style="font-size:0.75rem; font-weight:700; color:#4f46e5;">EDC Terminal Connected</span>
          </div>

          <!-- Row 3: Action & Details Box (Identical styling, position & height to Cash's Change Box!) -->
          <div style="background:var(--surface-container-lowest);border-radius:0.75rem;padding:0.75rem 1rem;display:flex;justify-content:space-between;align-items:center;border:1px solid var(--outline-variant);height:4.25rem;box-sizing:border-box;">
            <div style="display:flex;align-items:center;gap:0.75rem;flex:1;min-width:0;">
              
              <!-- Miniature Animated QRIS SVG (Left Item) -->
              <div id="mini-qris-container" style="display:none;position:relative;width:2.75rem;height:2.75rem;background:#fff;padding:0.25rem;border-radius:0.375rem;box-shadow:0 2px 6px rgba(0,0,0,0.06);border:1px solid var(--outline-variant);overflow:hidden;box-sizing:border-box;flex-shrink:0;">
                <svg viewBox="0 0 100 100" style="width:100%;height:100%;fill:#001f3f;">
                  <rect x="0" y="0" width="25" height="25" rx="1"/>
                  <rect x="3" y="3" width="19" height="19" fill="#fff" rx="0.5"/>
                  <rect x="6" y="6" width="13" height="13" rx="0.5"/>
                  
                  <rect x="75" y="0" width="25" height="25" rx="1"/>
                  <rect x="78" y="3" width="19" height="19" fill="#fff" rx="0.5"/>
                  <rect x="81" y="6" width="13" height="13" rx="0.5"/>

                  <rect x="0" y="75" width="25" height="25" rx="1"/>
                  <rect x="3" y="78" width="19" height="19" fill="#fff" rx="0.5"/>
                  <rect x="6" y="81" width="13" height="13" rx="0.5"/>

                  <rect x="35" y="5" width="10" height="10"/>
                  <rect x="55" y="5" width="10" height="5"/>
                  <rect x="35" y="20" width="5" height="10"/>
                  <rect x="45" y="25" width="10" height="10"/>
                  <rect x="60" y="18" width="8" height="8"/>
                  <rect x="5" y="35" width="10" height="10"/>
                  <rect x="20" y="45" width="10" height="5"/>
                  <rect x="5" y="55" width="5" height="10"/>
                  <rect x="15" y="60" width="10" height="10"/>
                  <rect x="35" y="45" width="15" height="15"/>
                  <rect x="55" y="40" width="10" height="15"/>
                  <rect x="70" y="35" width="10" height="10"/>
                </svg>
                <!-- Scan line animation -->
                <div class="scan-line" style="height:2px;box-shadow:0 0 6px #22c55e;"></div>
              </div>

              <!-- Miniature Card Mockup (Left Item) -->
              <div id="mini-card-container" style="display:none;align-items:center;justify-content:center;flex-shrink:0;">
                <div class="mock-card-glow" style="padding:2px;border-radius:0.5rem;">
                  <div class="mock-card" style="width:4.25rem;height:2.5rem;padding:0.25rem;border-radius:0.375rem;box-shadow:0 4px 10px rgba(0,0,0,0.15);justify-content:space-between;">
                    <div style="display:flex;justify-content:space-between;align-items:center;width:100%;margin-bottom:0.125rem;height:0.625rem;line-height:1;">
                      <span class="material-symbols-outlined" style="font-size:0.625rem;color:rgba(255,255,255,0.85);font-variation-settings:'FILL' 1;">wifi_tethering</span>
                      <span style="font-size:0.3125rem;font-weight:900;color:rgba(255,255,255,0.7);text-transform:uppercase;">CARD</span>
                    </div>
                    <div style="width:0.5rem;height:0.375rem;background:linear-gradient(135deg,#f59e0b,#d97706);border-radius:1px;margin-bottom:0.125rem;"></div>
                    <div style="font-size:0.375rem;font-weight:600;letter-spacing:0.05em;color:#fff;font-family:monospace;line-height:1;">•••• 8888</div>
                  </div>
                </div>
              </div>

              <!-- Payment Method Action Details (Middle Text) -->
              <div style="flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;">
                <p style="font-size:0.75rem;font-weight:800;color:#1e3a5f;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:0 0 0.125rem 0;line-height:1.2;" id="noncash-detail-title">QRIS Dynamic QR</p>
                <p style="font-size:0.625rem;color:var(--on-surface-variant);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:0;line-height:1.2;" id="noncash-detail-desc">Tampilkan QRIS ke pelanggan</p>
              </div>

            </div>

            <!-- Right Icon (Identical structure to Cash's Payments circle icon) -->
            <div style="background:var(--primary-container);color:#fff;width:2.25rem;height:2.25rem;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
              <span class="material-symbols-outlined" style="font-size:1.25rem;" id="noncash-icon-right">qr_code_scanner</span>
            </div>
          </div>

        </div>
      </div>

      <!-- Confirm Button -->
      <button class="btn btn-primary btn-full btn-lg" onclick="confirmPayment()" id="confirm-btn">
        <span class="material-symbols-outlined">check_circle</span>
        Confirm Payment
      </button>
      <p id="confirm-error" style="color:var(--error);font-size:0.75rem;margin-top:0.5rem;display:none;"></p>
    </div>
  </div>
</div>

<style>
.pay-option{display:flex;flex-direction:column;align-items:center;gap:0.5rem;padding:1.25rem;border:2px solid var(--outline-variant);border-radius:0.75rem;cursor:pointer;transition:all 0.15s;font-size:0.8125rem;font-weight:600;color:var(--on-surface-variant);}
.pay-option:hover{border-color:var(--primary-container);color:#1e3a5f;}
.pay-option.selected{border-color:var(--primary-container);background:rgba(0,31,63,0.05);color:#1e3a5f;}
.pay-option .material-symbols-outlined{font-size:1.75rem;}

.mobile-only { display: none !important; }
.desktop-only { display: grid !important; }

/* ── QRIS Scan Line Animation ── */
.scan-line {
  position: absolute;
  left: 0;
  right: 0;
  height: 3px;
  background: #22c55e;
  box-shadow: 0 0 10px #22c55e, 0 0 4px #22c55e;
  animation: scan-anim 2s infinite ease-in-out;
}
@keyframes scan-anim {
  0% { top: 0%; }
  50% { top: 100%; }
  100% { top: 0%; }
}

/* ── Card Mockup Animation and Layout ── */
.mock-card-glow {
  background: linear-gradient(135deg, rgba(79,70,229,0.15), rgba(124,58,237,0.15));
  padding: 5px;
  border-radius: 0.9rem;
  animation: pulse-glow 3s infinite ease-in-out;
}
@keyframes pulse-glow {
  0%, 100% { transform: scale(1); box-shadow: 0 0 0 rgba(124,58,237,0); }
  50% { transform: scale(1.02); box-shadow: 0 0 16px rgba(124,58,237,0.25); }
}

.mock-card {
  width: 12rem;
  height: 7rem;
  background: linear-gradient(135deg, #001f3f 0%, #0a2d52 60%, #1a3a6b 100%);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 0.75rem;
  padding: 0.75rem;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  box-shadow: 0 8px 20px rgba(0,0,0,0.2);

  overflow: hidden;

  .mobile-only { display: block !important; }

    grid-template-columns: 1fr !important;

    gap: 1.5rem !important;
    padding-bottom: 2rem;
  }

</style>

<script type="module">
import State from '/js/state.js';
import { TransactionsAPI } from '/js/api.js';
import { formatRupiah, showToast } from '/js/utils.js';

let selectedMethod = 'cash';
let totals = { subtotal: 0, tax: 0, total: 0 };

function updateTotals() {
  totals = State.getCartTotals();
  const taxRatePct = (State.settings.taxRate * 100).toFixed(1).replace(/\.0$/, '');
  document.getElementById('co-tax-label').textContent = `Tax (${taxRatePct}%)`;
  document.getElementById('co-subtotal').textContent = formatRupiah(totals.subtotal);
  document.getElementById('co-tax').textContent = formatRupiah(totals.tax);
  document.getElementById('co-total').textContent = formatRupiah(totals.total);
  
  const ncAmount = document.getElementById('noncash-amount-display');
  if (ncAmount) {
    ncAmount.value = totals.total.toLocaleString('id-ID');
  }
}

function init() {
  if (!State.cart.length) { navigate('/pos'); return; }
  updateTotals();

  // Re-render if settings load from server after page init
  State.on('settings', () => updateTotals());

  const summary = document.getElementById('order-summary');
  summary.innerHTML = State.cart.map(item => `
    <div style="display:flex;justify-content:space-between;align-items:center;padding:0.875rem 1.25rem;border-bottom:1px solid rgba(196,198,207,0.1);">
      <div style="flex:1;min-width:0;padding-right:1.5rem;">
        <p style="font-size:0.875rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${item.name}</p>
        <p style="font-size:0.75rem;color:var(--on-surface-variant);">x${item.qty} × ${formatRupiah(item.price)}</p>
      </div>
      <span style="font-weight:700;font-size:0.875rem;" class="text-rupiah">${formatRupiah(item.price * item.qty)}</span>
    </div>
  `).join('');

  renderPaymentMethods();
}

function renderPaymentMethods() {
  const container = document.getElementById('payment-options-container');
  const enabledMethods = State.settings.enabledPaymentMethods || ['cash', 'debit', 'qris', 'credit'];
  
  const methods = [
    { id: 'cash', label: 'Cash', icon: 'payments' },
    { id: 'qris', label: 'QRIS', icon: 'qr_code_scanner' },
    { id: 'debit', label: 'Debit Card', icon: 'credit_card' },
    { id: 'credit', label: 'Credit Card', icon: 'credit_score' }
  ];

  const filtered = methods.filter(m => enabledMethods.includes(m.id));
  
  // Reset selected method if current one is disabled
  if (!enabledMethods.includes(selectedMethod)) {
    selectedMethod = enabledMethods[0];
  }

  container.innerHTML = filtered.map(m => `
    <div class="pay-option ${m.id === selectedMethod ? 'selected' : ''}" data-method="${m.id}" onclick="selectMethod(this)">
      <span class="material-symbols-outlined">${m.icon}</span>
      <span>${m.label}</span>
    </div>
  `).join('');

  const select = document.getElementById('payment-method-select');
  if (select) {
    select.innerHTML = filtered.map(m => `
      <option value="${m.id}" ${m.id === selectedMethod ? 'selected' : ''}>${m.label}</option>
    `).join('');
  }

  // Update form visibility
  selectMethod({ dataset: { method: selectedMethod } }, true); 
}

window.selectMethod = function(el, isInitial = false) {
  selectedMethod = el.dataset.method;
  
  if (!isInitial) {
    document.querySelectorAll('.pay-option').forEach(o => {
      if (o.dataset.method === selectedMethod) o.classList.add('selected');
      else o.classList.remove('selected');
    });
    const select = document.getElementById('payment-method-select');
    if (select) select.value = selectedMethod;
  }
  
  const cashForm = document.getElementById('cash-form');
  const ncForm = document.getElementById('noncash-form');
  
  if (selectedMethod === 'cash') {
    cashForm.style.display = 'flex';
    ncForm.style.display = 'none';
  } else {
    cashForm.style.display = 'none';
    ncForm.style.display = 'flex';
    
    const miniQris = document.getElementById('mini-qris-container');
    const miniCard = document.getElementById('mini-card-container');
    const detailTitle = document.getElementById('noncash-detail-title');
    const detailDesc = document.getElementById('noncash-detail-desc');
    const rightIcon = document.getElementById('noncash-icon-right');
    const statusIcon = document.getElementById('noncash-status-icon');
    const statusText = document.getElementById('noncash-status-text');
    const amountLabel = document.getElementById('noncash-amount-label');
    
    if (selectedMethod === 'qris') {
      if (amountLabel) amountLabel.textContent = 'Amount to Pay (QRIS)';
      if (statusIcon) {
        statusIcon.textContent = 'qr_code_scanner';
        statusIcon.style.animation = 'pulse 1.5s infinite';
      }
      if (statusText) statusText.textContent = 'QRIS Dynamic QR Code Active';
      
      if (miniQris) miniQris.style.display = 'block';
      if (miniCard) miniCard.style.display = 'none';
      if (detailTitle) detailTitle.textContent = 'QRIS Dynamic QR';
      if (detailDesc) detailDesc.textContent = 'Tampilkan barcode QRIS ke pelanggan';
      if (rightIcon) rightIcon.textContent = 'qr_code_scanner';
    } else {
      const isDebit = selectedMethod === 'debit';
      if (amountLabel) amountLabel.textContent = isDebit ? 'Amount to Pay (Debit)' : 'Amount to Pay (Credit)';
      if (statusIcon) {
        statusIcon.textContent = 'sensors';
        statusIcon.style.animation = 'pulse 1.5s infinite';
      }
      if (statusText) statusText.textContent = 'EDC Terminal Connected';
      
      if (miniQris) miniQris.style.display = 'none';
      if (miniCard) miniCard.style.display = 'block';
      
      const cardTypeLabel = document.querySelector('#mini-card-container span[style*="font-weight:900"]');
      if (cardTypeLabel) {
        cardTypeLabel.textContent = isDebit ? 'DEBIT' : 'CREDIT';
      }
      
      if (detailTitle) detailTitle.textContent = isDebit ? 'Debit Card Payment' : 'Credit Card Payment';
      if (detailDesc) detailDesc.textContent = 'Gesek atau tempel kartu pada mesin EDC';
      if (rightIcon) rightIcon.textContent = isDebit ? 'credit_card' : 'credit_score';
    }
  }
};

window.setCash = function(val) {
  const input = document.getElementById('cash-input');
  if (val === 'exact') {
    input.value = totals.total.toLocaleString('id-ID');
  } else {
    // Increment the current value
    const current = parseInt(input.value.replace(/\./g, '')) || 0;
    const added = parseInt(val);
    input.value = (current + added).toLocaleString('id-ID');
  }
  calcChange();
};

window.formatCurrencyInput = function(el) {
  let val = el.value.replace(/[^0-9]/g, '');
  if (val) el.value = parseInt(val, 10).toLocaleString('id-ID');
  else el.value = '';
};

window.calcChange = function() {
  const cashStr = document.getElementById('cash-input').value.replace(/\./g, '');
  const cash = parseInt(cashStr) || 0;
  const change = Math.max(0, cash - totals.total);
  document.getElementById('change-amount').textContent = formatRupiah(change);
};

window.confirmPayment = async function() {
  const btn = document.getElementById('confirm-btn');
  const errEl = document.getElementById('confirm-error');
  errEl.style.display = 'none';

  if (selectedMethod === 'cash') {
    const cashStr = document.getElementById('cash-input').value.replace(/\./g, '');
    const cash = parseInt(cashStr) || 0;
    if (cash < totals.total) { errEl.textContent = 'Cash received is less than total amount'; errEl.style.display = 'block'; return; }
  }

  btn.disabled = true;
  btn.innerHTML = `<span class="material-symbols-outlined" style="animation:spin 1s linear infinite">refresh</span> Processing...`;

  try {
    let txn;

    if (State.isGuest) {
      // Guest mode: simulate a transaction without hitting the database
      const cashReceived = selectedMethod === 'cash'
        ? (parseInt(document.getElementById('cash-input').value.replace(/\./g, '')) || 0)
        : null;
      txn = {
        id: 'demo-' + Date.now(),
        transaction_number: 'DEMO-' + Math.floor(1000 + Math.random() * 9000),
        created_at: new Date().toISOString(),
        payment_method: selectedMethod,
        cash_received: cashReceived,
        change_amount: cashReceived ? Math.max(0, cashReceived - totals.total) : 0,
        subtotal: totals.subtotal,
        tax_amount: totals.tax,
        total_amount: totals.total,
        customer_name: 'Walk-in Customer',
        terminal: State.settings.terminal || 'Terminal 01',
        status: 'completed',
        items: State.cart.map(i => ({
          product_name: i.name,
          product_sku: i.sku,
          quantity: i.qty,
          unit_price: i.price,
          subtotal: i.price * i.qty
        }))
      };
    } else {
      txn = await TransactionsAPI.create({
        items: State.cart.map(i => ({ product_id: i.product_id, product_name: i.name, product_sku: i.sku, quantity: i.qty, unit_price: i.price })),
        customer_name: State.currentUser.customerName || 'Walk-in Customer',
        payment_method: selectedMethod,
        cash_received: selectedMethod === 'cash' ? (parseInt(document.getElementById('cash-input').value.replace(/\./g, ''))||0) : null,
        terminal: State.settings.terminal
      });
    }

    State.setCurrentTxn(txn);
    State.clearCart();
    navigate('/receipt');
  } catch (err) {
    errEl.textContent = err.message;
    errEl.style.display = 'block';
    btn.disabled = false;
    btn.innerHTML = `<span class="material-symbols-outlined">check_circle</span> Confirm Payment`;
    showToast('Payment failed: ' + err.message, 'error');
  }
};

init();
</script>
