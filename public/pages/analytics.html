<!-- pages/analytics.html -->
<div class="fade-in">
  <div style="display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:2rem;">
    <div>
      <p style="font-size:0.625rem;text-transform:uppercase;letter-spacing:0.15em;font-weight:700;color:var(--on-surface-variant);">Business Intelligence</p>
      <h1 style="font-size:1.875rem;font-weight:800;color:#1e3a5f;">Monthly Analytics</h1>
    </div>
    <div style="display:flex;gap:0.75rem;align-items:center;">
      <input type="month" id="analytics-month" class="form-input" style="max-width:12rem;" onchange="loadAnalytics()" />
      <button class="btn btn-secondary btn-sm" onclick="window.print()">
        <span class="material-symbols-outlined" style="font-size:1rem;">download</span>Export
      </button>
    </div>
  </div>

  <!-- KPI Cards -->
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;margin-bottom:2rem;">
    <div class="card-hero" style="padding:1.5rem;grid-column:span 2;">
      <p style="font-size:0.625rem;text-transform:uppercase;letter-spacing:0.1em;color:var(--on-primary-container);">Monthly Revenue</p>
      <h3 id="a-revenue" style="font-size:2rem;font-weight:800;color:#fff;margin:0.25rem 0;" class="text-rupiah">—</h3>
      <div style="display:flex;align-items:center;gap:0.5rem;">
        <span class="material-symbols-outlined" id="a-rev-icon" style="font-size:1rem;color:#4ade80;">trending_up</span>
        <span id="a-rev-pct" style="font-size:0.75rem;color:rgba(255,255,255,0.7);">—% vs last month</span>
      </div>
    </div>
    <div class="card" style="padding:1.5rem;">
      <p style="font-size:0.625rem;text-transform:uppercase;letter-spacing:0.1em;font-weight:700;color:var(--on-surface-variant);">Total Orders</p>
      <h3 id="a-orders" style="font-size:1.5rem;font-weight:800;color:#1e3a5f;margin-top:0.25rem;">—</h3>
    </div>
    <div class="card" style="padding:1.5rem;">
      <p style="font-size:0.625rem;text-transform:uppercase;letter-spacing:0.1em;font-weight:700;color:var(--on-surface-variant);">Avg. Order</p>
      <h3 id="a-avg" style="font-size:1.5rem;font-weight:800;color:#1e3a5f;margin-top:0.25rem;" class="text-rupiah">—</h3>
    </div>
  </div>

  <div style="display:grid;grid-template-columns:1fr 1.2fr;gap:1.5rem;">
    <!-- Daily Revenue Chart -->
    <div class="card" style="padding:1.5rem;">
      <h2 style="font-size:0.875rem;font-weight:700;color:#1e3a5f;margin-bottom:1.25rem;">Revenue — Daily Breakdown</h2>
      <div id="daily-chart" style="display:flex;align-items:flex-end;gap:2px;height:10rem;"></div>
      <div style="display:flex;justify-content:space-between;margin-top:0.375rem;font-size:0.6rem;color:var(--on-surface-variant);">
        <span>1</span><span>10</span><span>20</span><span id="last-day">31</span>
      </div>
    </div>

    <!-- Top Products -->
    <div class="card" style="padding:1.5rem;">
      <h2 style="font-size:0.875rem;font-weight:700;color:#1e3a5f;margin-bottom:1.25rem;">🏆 Top 5 Products This Month</h2>
      <div id="a-top-products" style="display:flex;flex-direction:column;gap:0.875rem;"></div>
    </div>
  </div>
</div>

<script type="module">
import { ReportsAPI } from '/js/api.js';
import { formatRupiah, currentMonthISO } from '/js/utils.js';

document.getElementById('analytics-month').value = currentMonthISO();

async function loadAnalytics() {
  window.loadAnalytics = loadAnalytics;
  const month = document.getElementById('analytics-month').value || currentMonthISO();
  try {
    const data = await ReportsAPI.monthly(month);
    const { totalRevenue, totalOrders, avgOrder, revChangePct } = data.summary;

    document.getElementById('a-revenue').textContent = formatRupiah(totalRevenue);
    document.getElementById('a-orders').textContent  = totalOrders;
    document.getElementById('a-avg').textContent     = formatRupiah(avgOrder);

    const pct = revChangePct || 0;
    document.getElementById('a-rev-pct').textContent = `${pct >= 0 ? '+' : ''}${pct}% vs last month`;
    document.getElementById('a-rev-icon').textContent = pct >= 0 ? 'trending_up' : 'trending_down';
    document.getElementById('a-rev-icon').style.color = pct >= 0 ? '#4ade80' : '#f87171';

    // Daily chart
    const maxRev = Math.max(...data.daily.map(d=>d.revenue), 1);
    document.getElementById('last-day').textContent = data.daily.length;
    document.getElementById('daily-chart').innerHTML = data.daily.map(d => {
      const pct = Math.max(2, (d.revenue / maxRev) * 100);
      const isWeekend = (new Date(month + '-' + String(d.day).padStart(2,'0'))).getDay() % 6 === 0;
      return `<div title="Day ${d.day}: ${formatRupiah(d.revenue)}" style="flex:1;background:${d.revenue>0?(isWeekend?'rgba(0,31,63,0.5)':'var(--primary-container)'):'var(--surface-container-high)'};border-radius:2px 2px 0 0;height:${pct}%;cursor:default;transition:height 0.5s;"></div>`;
    }).join('');

    // Top products
    const topDiv = document.getElementById('a-top-products');
    if (!data.topProducts.length) {
      topDiv.innerHTML = `<p style="color:var(--outline);font-size:0.875rem;">No sales data this month</p>`;
    } else {
      const maxRev2 = data.topProducts[0].revenue;
      const medals = ['🥇','🥈','🥉','4️⃣','5️⃣'];
      topDiv.innerHTML = data.topProducts.map((p,i) => `
        <div style="display:flex;align-items:center;gap:0.875rem;">
          <span style="font-size:1.25rem;">${medals[i]||i+1}</span>
          <div style="flex:1;">
            <div style="display:flex;justify-content:space-between;font-size:0.8125rem;margin-bottom:0.25rem;">
              <span style="font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:12rem;">${p.name}</span>
              <span style="font-weight:700;" class="text-rupiah">${formatRupiah(p.revenue)}</span>
            </div>
            <div style="height:0.375rem;background:var(--surface-container-high);border-radius:9999px;overflow:hidden;">
              <div style="height:100%;width:${Math.round(p.revenue/maxRev2*100)}%;background:${i===0?'#22c55e':i===1?'#3b82f6':i===2?'#f59e0b':'var(--primary-container)'};border-radius:9999px;"></div>
            </div>
            <span style="font-size:0.6875rem;color:var(--on-surface-variant);">${p.qty} units sold</span>
          </div>
        </div>`).join('');
    }
  } catch (err) {
    document.getElementById('a-revenue').textContent = 'Error';
    document.getElementById('a-top-products').innerHTML = `<p style="color:var(--error);">${err.message}</p>`;
  }
}

loadAnalytics();
</script>
