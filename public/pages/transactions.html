<!-- pages/transactions.html -->
<div class="fade-in">
  <div style="margin-bottom:2rem;">
    <p style="font-size:0.625rem;text-transform:uppercase;letter-spacing:0.15em;font-weight:700;color:var(--on-surface-variant);">History</p>
    <h1 style="font-size:1.875rem;font-weight:800;color:#1e3a5f;">Transaction History</h1>
  </div>

  <!-- Filters -->
  <div style="display:flex;gap:0.75rem;align-items:center;margin-bottom:1.5rem;flex-wrap:wrap;">
    <input type="text" id="txn-search" class="form-input" placeholder="Search by TXN# or customer..." style="max-width:20rem;" oninput="debouncedLoad()" />
    <input type="date" id="txn-date" class="form-input" style="max-width:12rem;" onchange="loadTxns()" />
    <select id="txn-method" class="form-input form-select" style="max-width:10rem;" onchange="loadTxns()">
      <option value="">All Methods</option>
      <option value="cash">Cash</option>
      <option value="qris">QRIS</option>
      <option value="debit">Debit</option>
      <option value="credit">Credit</option>
    </select>
    <button class="btn btn-ghost btn-sm" onclick="clearFilters()">
      <span class="material-symbols-outlined" style="font-size:1rem;">filter_alt_off</span>Clear
    </button>
  </div>

  <!-- Table -->
  <div class="card" style="overflow:hidden;">
    <div style="overflow-x:auto;">
      <table class="data-table">
        <thead><tr>
          <th>TXN #</th><th>Date & Time</th><th>Customer</th>
          <th>Items</th><th style="text-align:right;">Total</th>
          <th>Method</th><th>Status</th><th></th>
        </tr></thead>
        <tbody id="txn-tbody">
          <tr><td colspan="8" style="text-align:center;padding:3rem;color:var(--on-surface-variant);">Loading...</td></tr>
        </tbody>
      </table>
    </div>
    <div class="pagination" id="txn-pagination" style="display:none;">
      <p class="pagination-info" id="txn-pag-info">—</p>
      <div class="pagination-controls" id="txn-pag-ctrl"></div>
    </div>
  </div>
</div>

<script type="module">
import { TransactionsAPI } from '/js/api.js';
import { formatRupiah, formatDate, debounce } from '/js/utils.js';

let currentPage = 1;
const limit = 20;
const methodIcons = { cash:'payments', qris:'qr_code_scanner', debit:'credit_card', credit:'credit_score' };

async function loadTxns() {
  window.loadTxns = loadTxns;
  const tbody = document.getElementById('txn-tbody');
  tbody.innerHTML = `<tr><td colspan="8" style="text-align:center;padding:3rem;color:var(--on-surface-variant);">Loading...</td></tr>`;
  try {
    const params = { page: currentPage, limit };
    const search = document.getElementById('txn-search')?.value?.trim();
    const date   = document.getElementById('txn-date')?.value;
    const method = document.getElementById('txn-method')?.value;
    if (search) params.search = search;
    if (date)   params.date   = date;
    if (method) params.method = method;

    const { transactions, pagination } = await TransactionsAPI.list(params);

    if (!transactions.length) {
      tbody.innerHTML = `<tr><td colspan="8" style="text-align:center;padding:3rem;color:var(--outline);">No transactions found</td></tr>`;
      document.getElementById('txn-pagination').style.display = 'none';
      return;
    }

    tbody.innerHTML = transactions.map(t => {
      const items = (t.transaction_items||[]);
      const itemSummary = items.length > 0 ? `${items.length} item${items.length>1?'s':''}` : '—';
      const statusColor = t.status === 'completed' ? '#15803d' : t.status === 'voided' ? 'var(--error)' : '#b45309';
      const methodIcon  = methodIcons[t.payment_method] || 'payments';
      return `<tr>
        <td><span style="font-family:monospace;font-size:0.75rem;font-weight:700;color:#1e3a5f;">${t.txn_number}</span></td>
        <td style="font-size:0.8125rem;">${formatDate(t.created_at,'datetime')}</td>
        <td style="font-size:0.8125rem;">${t.customer_name||'Walk-in'}</td>
        <td style="font-size:0.8125rem;color:var(--on-surface-variant);">${itemSummary}</td>
        <td style="text-align:right;font-weight:700;" class="text-rupiah">${formatRupiah(t.total)}</td>
        <td>
          <div style="display:flex;align-items:center;gap:0.375rem;font-size:0.8125rem;text-transform:capitalize;">
            <span class="material-symbols-outlined" style="font-size:1rem;color:var(--on-surface-variant);">${methodIcon}</span>
            ${t.payment_method||'—'}
          </div>
        </td>
        <td><span class="badge" style="background:${statusColor}1a;color:${statusColor};">${t.status}</span></td>
        <td>
          <button class="btn btn-ghost btn-sm" onclick="showDetail('${t.id}')">
            <span class="material-symbols-outlined" style="font-size:1rem;">visibility</span>
          </button>
        </td>
      </tr>`;
    }).join('');

    // Pagination
    const pag = document.getElementById('txn-pagination');
    pag.style.display = 'flex';
    document.getElementById('txn-pag-info').textContent = `Showing ${(currentPage-1)*limit+1}–${Math.min(currentPage*limit,pagination.total)} of ${pagination.total}`;
    document.getElementById('txn-pag-ctrl').innerHTML = `
      <button class="page-btn" onclick="changePage(${currentPage-1})" ${currentPage<=1?'disabled':''}>
        <span class="material-symbols-outlined" style="font-size:1.125rem;">chevron_left</span>
      </button>
      <span class="page-btn active">${currentPage}</span>
      <button class="page-btn" onclick="changePage(${currentPage+1})" ${currentPage>=pagination.pages?'disabled':''}>
        <span class="material-symbols-outlined" style="font-size:1.125rem;">chevron_right</span>
      </button>`;
  } catch (err) {
    tbody.innerHTML = `<tr><td colspan="8" style="text-align:center;padding:2rem;color:var(--error);">${err.message}</td></tr>`;
  }
}

window.showDetail = async function(id) {
  try {
    const t = await TransactionsAPI.get(id);
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.innerHTML = `<div class="modal" style="max-width:32rem;">
      <div style="display:flex;justify-content:space-between;margin-bottom:1.5rem;">
        <div><h3 style="font-weight:700;font-size:1rem;">${t.txn_number}</h3>
        <p style="font-size:0.75rem;color:var(--on-surface-variant);">${formatDate(t.created_at,'datetime')}</p></div>
        <button onclick="this.closest('.modal-overlay').remove()" style="background:none;border:none;cursor:pointer;"><span class="material-symbols-outlined">close</span></button>
      </div>
      <div style="display:flex;flex-direction:column;gap:0.625rem;margin-bottom:1rem;">
        ${(t.transaction_items||[]).map(i=>`<div style="display:flex;justify-content:space-between;font-size:0.875rem;"><span>${i.product_name} × ${i.quantity}</span><span style="font-weight:600;" class="text-rupiah">${formatRupiah(i.subtotal)}</span></div>`).join('')}
        <div style="border-top:1px solid var(--outline-variant);padding-top:0.5rem;display:flex;justify-content:space-between;font-weight:700;">
          <span>TOTAL</span><span class="text-rupiah">${formatRupiah(t.total)}</span>
        </div>
      </div>
      <div style="display:flex;gap:0.75rem;justify-content:flex-end;">
        <button class="btn btn-ghost btn-sm" onclick="window.print()"><span class="material-symbols-outlined" style="font-size:1rem;">print</span>Print</button>
        <button class="btn btn-ghost btn-sm" onclick="this.closest('.modal-overlay').remove()">Close</button>
      </div>
    </div>`;
    document.body.appendChild(overlay);
    overlay.onclick = e => { if(e.target===overlay) overlay.remove(); };
  } catch (err) { alert('Error: ' + err.message); }
};

window.changePage = function(p) { currentPage = p; loadTxns(); };
window.clearFilters = function() {
  document.getElementById('txn-search').value = '';
  document.getElementById('txn-date').value = '';
  document.getElementById('txn-method').value = '';
  currentPage = 1; loadTxns();
};

const debouncedLoad = debounce(() => { currentPage = 1; loadTxns(); }, 400);
window.debouncedLoad = debouncedLoad;

loadTxns();
</script>
