<!-- pages/settings.html -->
<div class="fade-in">
  <!-- Page Header -->
  <div style="margin-bottom:2rem;">
    <h1 style="font-size:1.875rem;font-weight:800;letter-spacing:-0.02em;color:#1e3a5f;">Settings</h1>
    <p style="font-size:0.8125rem;color:var(--on-surface-variant);margin-top:0.25rem;">Manage your profile and application preferences</p>
  </div>

  <div class="page-layout-2col">
    
    <!-- Left Column -->
    <div style="display:flex;flex-direction:column;gap:2rem;">
      
      <!-- 1. Profile Settings -->
      <div class="card" style="padding:1.5rem;">
        <div style="display:flex;align-items:center;gap:0.75rem;margin-bottom:1.5rem;border-bottom:1px solid var(--surface-container-high);padding-bottom:1rem;">
          <div style="width:2.5rem;height:2.5rem;background:var(--primary-container);color:var(--on-primary-container);border-radius:0.5rem;display:flex;align-items:center;justify-content:center;">
            <span class="material-symbols-outlined">person</span>
          </div>
          <div>
            <h2 style="font-size:1rem;font-weight:700;color:#1e3a5f;">Account Profile</h2>
            <p style="font-size:0.625rem;color:var(--on-surface-variant);text-transform:uppercase;">Personal Information</p>
          </div>
        </div>

        <div style="display:flex;flex-direction:column;gap:1rem;">
          <div class="form-group">
            <label class="form-label">Employee ID (Read Only)</label>
            <input type="text" id="set-empid" class="form-input" disabled style="background:var(--surface-container-low);color:var(--on-surface-variant);" />
          </div>
          <div class="form-group">
            <label class="form-label">Role (Read Only)</label>
            <input type="text" id="set-role" class="form-input" disabled style="background:var(--surface-container-low);color:var(--on-surface-variant);text-transform:capitalize;" />
          </div>
          <div class="form-group">
            <label class="form-label">Full Name</label>
            <input type="text" id="set-name" class="form-input" />
          </div>
          <button class="btn btn-primary btn-sm" onclick="updateProfile()" style="align-self:flex-start;">Update Profile</button>
        </div>
      </div>

      <!-- 2. Security Settings -->
      <div class="card" style="padding:1.5rem;">
        <div style="display:flex;align-items:center;gap:0.75rem;margin-bottom:1.5rem;border-bottom:1px solid var(--surface-container-high);padding-bottom:1rem;">
          <div style="width:2.5rem;height:2.5rem;background:var(--error-container);color:var(--on-error-container);border-radius:0.5rem;display:flex;align-items:center;justify-content:center;">
            <span class="material-symbols-outlined">lock</span>
          </div>
          <div>
            <h2 style="font-size:1rem;font-weight:700;color:#1e3a5f;">Security</h2>
            <p style="font-size:0.625rem;color:var(--on-surface-variant);text-transform:uppercase;">Change Password</p>
          </div>
        </div>

        <div style="display:flex;flex-direction:column;gap:1rem;">
          <div class="form-group">
            <label class="form-label">New Password</label>
            <div style="position:relative;">
              <input type="password" id="set-pass1" class="form-input" placeholder="Min. 6 characters" style="padding-right:2.75rem;" />
              <button type="button" onclick="togglePass('set-pass1','eye-pass1')" tabindex="-1"
                style="position:absolute;right:0.625rem;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--on-surface-variant);display:flex;align-items:center;padding:0.25rem;">
                <span class="material-symbols-outlined" id="eye-pass1" style="font-size:1.125rem;">visibility</span>
              </button>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Confirm New Password</label>
            <div style="position:relative;">
              <input type="password" id="set-pass2" class="form-input" placeholder="Repeat new password" style="padding-right:2.75rem;" />
              <button type="button" onclick="togglePass('set-pass2','eye-pass2')" tabindex="-1"
                style="position:absolute;right:0.625rem;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--on-surface-variant);display:flex;align-items:center;padding:0.25rem;">
                <span class="material-symbols-outlined" id="eye-pass2" style="font-size:1.125rem;">visibility</span>
              </button>
            </div>
          </div>
          <button class="btn btn-primary btn-sm" onclick="updatePassword()" style="align-self:flex-start;">Change Password</button>
        </div>
      </div>

    </div>

    <!-- Right Column -->
    <div style="display:flex;flex-direction:column;gap:2rem;">
      
      <!-- 3. App Preferences -->
      <div class="card" style="padding:1.5rem;">
        <div style="display:flex;align-items:center;gap:0.75rem;margin-bottom:1.5rem;border-bottom:1px solid var(--surface-container-high);padding-bottom:1rem;">
          <div style="width:2.5rem;height:2.5rem;background:var(--secondary-container);color:var(--on-secondary-container);border-radius:0.5rem;display:flex;align-items:center;justify-content:center;">
            <span class="material-symbols-outlined">desktop_windows</span>
          </div>
          <div>
            <h2 style="font-size:1rem;font-weight:700;color:#1e3a5f;">App Preferences</h2>
            <p style="font-size:0.625rem;color:var(--on-surface-variant);text-transform:uppercase;">Terminal & Display</p>
          </div>
        </div>

        <div style="display:flex;flex-direction:column;gap:1rem;">
          <div class="form-group">
            <label class="form-label">Terminal / Register Name</label>
            <select id="set-terminal" class="form-input form-select" onchange="saveAppPrefs()">
              <option value="Terminal 01">Terminal 01 (Main Cashier)</option>
              <option value="Terminal 02">Terminal 02 (Secondary)</option>
              <option value="Back Office">Back Office</option>
            </select>
            <p style="font-size:0.6875rem;color:var(--on-surface-variant);margin-top:0.25rem;">Transactions will be recorded under this terminal.</p>
          </div>
        </div>
      </div>

      <!-- 4. Store Settings (Manager Only) -->
      <div id="manager-settings-section" class="card" style="padding:1.5rem;display:none;">
        <div style="display:flex;align-items:center;gap:0.75rem;margin-bottom:1.5rem;border-bottom:1px solid var(--surface-container-high);padding-bottom:1rem;">
          <div style="width:2.5rem;height:2.5rem;background:#fef08a;color:#854d0e;border-radius:0.5rem;display:flex;align-items:center;justify-content:center;">
            <span class="material-symbols-outlined">store</span>
          </div>
          <div>
            <h2 style="font-size:1rem;font-weight:700;color:#1e3a5f;">Store Settings</h2>
            <p style="font-size:0.625rem;color:var(--on-surface-variant);text-transform:uppercase;">Manager Only Configuration</p>
          </div>
        </div>

        <div style="display:flex;flex-direction:column;gap:1rem;">
          <div class="form-group">
            <label class="form-label">Store Name (For Receipts)</label>
            <input type="text" id="set-store-name" class="form-input" onchange="saveStorePrefs()" />
          </div>
          <div class="form-group">
            <label class="form-label">Tax Rate / PPN (%)</label>
            <input type="text" id="set-tax-rate" class="form-input" placeholder="e.g. 11" inputmode="decimal" oninput="this.value=this.value.replace(/[^0-9.]/g,'')" onchange="saveStorePrefs()" />
          </div>
          <div class="form-group">
            <label class="form-label">Receipt Footer Message</label>
            <textarea id="set-footer" class="form-input" rows="2" placeholder="e.g. Thank you for your purchase!" onchange="saveStorePrefs()"></textarea>
          </div>
          <div class="form-group" style="margin-top:0.5rem;">
            <label class="form-label" style="margin-bottom:0.75rem;">Enabled Payment Methods</label>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.75rem;" id="set-pay-methods">
              <label style="display:flex;align-items:center;gap:0.5rem;font-size:0.8125rem;cursor:pointer;">
                <input type="checkbox" value="cash" checked onchange="saveStorePrefs()" /> Cash
              </label>
              <label style="display:flex;align-items:center;gap:0.5rem;font-size:0.8125rem;cursor:pointer;">
                <input type="checkbox" value="qris" checked onchange="saveStorePrefs()" /> QRIS
              </label>
              <label style="display:flex;align-items:center;gap:0.5rem;font-size:0.8125rem;cursor:pointer;">
                <input type="checkbox" value="debit" checked onchange="saveStorePrefs()" /> Debit Card
              </label>
              <label style="display:flex;align-items:center;gap:0.5rem;font-size:0.8125rem;cursor:pointer;">
                <input type="checkbox" value="credit" checked onchange="saveStorePrefs()" /> Credit Card
              </label>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>

<script type="module">
import State from '/js/state.js';
import { AuthAPI } from '/js/api.js';
import { showToast } from '/js/utils.js';

// Load Current Data
function loadSettings() {
  const user = State.currentUser;
  if (!user) return;

  // Profile
  document.getElementById('set-empid').value = user.employee_id || 'N/A';
  document.getElementById('set-role').value = user.role || 'Unknown';
  document.getElementById('set-name').value = user.name || '';

  // Preferences
  const prefs = State.settings || {};
  document.getElementById('set-terminal').value = prefs.terminal || 'Terminal 01';

  // Manager Only Section
  if (user.role === 'manager' || user.role === 'admin') {
    document.getElementById('manager-settings-section').style.display = 'block';
    document.getElementById('set-store-name').value = prefs.storeName || 'GadgetStock';
    // taxRate in state is stored as decimal (e.g. 0.11), display as percent (11)
    const taxRatePct = prefs.taxRate ? (prefs.taxRate * 100).toFixed(2).replace(/\.?0+$/, '') : '11';
    document.getElementById('set-tax-rate').value = taxRatePct;
    document.getElementById('set-footer').value = prefs.receiptFooter || 'Terima kasih telah berbelanja!';
    
    // Payment Methods
    const enabledMethods = prefs.enabledPaymentMethods || ['cash', 'debit', 'qris', 'credit'];
    const checkboxes = document.querySelectorAll('#set-pay-methods input[type="checkbox"]');
    checkboxes.forEach(cb => {
      cb.checked = enabledMethods.includes(cb.value);
    });
  }
}

// Reload form when settings sync from server
State.on('settings', loadSettings);

// Toggle password visibility
window.togglePass = function(inputId, iconId) {
  const input = document.getElementById(inputId);
  const icon  = document.getElementById(iconId);
  if (input.type === 'password') {
    input.type = 'text';
    icon.textContent = 'visibility_off';
  } else {
    input.type = 'password';
    icon.textContent = 'visibility';
  }
};

// Global functions for inline onclick handlers
window.updateProfile = function() {
  const newName = document.getElementById('set-name').value.trim();
  if (!newName) return showToast('Name cannot be empty', 'error');
  
  // Optimistic UI update
  const user = State.currentUser;
  user.name = newName;
  user.initials = newName.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);
  State.setUser(user); 
  // In a real app, you would send an API request to update 'profiles' table here
  showToast('Profile name updated successfully', 'success');
};

window.updatePassword = async function() {
  const p1 = document.getElementById('set-pass1').value;
  const p2 = document.getElementById('set-pass2').value;
  if (!p1 || p1.length < 6) return showToast('Password minimal 6 karakter', 'error');
  if (p1 !== p2) return showToast('Password tidak sama', 'error');

  const userId = State.currentUser?.id;
  if (!userId) return showToast('Sesi tidak ditemukan, silakan login ulang', 'error');

  const btn = document.querySelector('button[onclick="updatePassword()"]');
  const originalText = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'Menyimpan...';

  try {
    await AuthAPI.changePassword(userId, p1);
    showToast('Password berhasil diubah', 'success');
    document.getElementById('set-pass1').value = '';
    document.getElementById('set-pass2').value = '';
  } catch (err) {
    showToast('Gagal mengubah password: ' + err.message, 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = originalText;
  }
};

window.saveAppPrefs = async function() {
  const term = document.getElementById('set-terminal').value;
  await State.updateSettings({ terminal: term });
  showToast('Terminal preference saved', 'success');
};

window.saveStorePrefs = async function() {
  const storeName = document.getElementById('set-store-name').value.trim();
  // Input is in percent (e.g. "11"), convert to decimal (0.11) for storage
  const taxRatePct = parseFloat(document.getElementById('set-tax-rate').value) || 0;
  const taxRate = taxRatePct / 100;
  const footer = document.getElementById('set-footer').value.trim();
  
  const enabledMethods = [];
  document.querySelectorAll('#set-pay-methods input[type="checkbox"]').forEach(cb => {
    if (cb.checked) enabledMethods.push(cb.value);
  });

  if (enabledMethods.length === 0) {
    showToast('At least one payment method must be enabled', 'error');
    loadSettings(); // revert checkboxes
    return;
  }
  
  await State.updateSettings({
    storeName,
    taxRate,
    receiptFooter: footer,
    enabledPaymentMethods: enabledMethods
  });
  showToast('Store settings saved successfully', 'success');
};

loadSettings();
</script>
